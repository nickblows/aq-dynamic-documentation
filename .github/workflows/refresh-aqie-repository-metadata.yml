name: Refresh AQIE repository metadata

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate AQIE metadata docs
        env:
          DEFRA_READONLY_PAT: ${{ secrets.DEFRA_READONLY_PAT }}
        run: |
          python scripts/update_aqie_repository_metadata.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No metadata changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repository-catalog.yaml docs/repositories/aqie-repository-inventory.md
          git commit -m "Refresh AQIE repository metadata"
          git push

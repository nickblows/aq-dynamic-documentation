# ---------------------------------------------------------------------------
# Known gaps requiring owner confirmation
# ---------------------------------------------------------------------------
open_questions:
  - id: oq-001
    question: "Does aqie-back-end still send notifications directly, or is this fully delegated to aqie-notify-service?"
    status: >-
      Answered 2026-11-19 — neither. aqie-back-end has no notification code: NOTIFY_BASE_URL
      (config key alertNotifucationUrl) is declared but never read, and package.json has no
      GOV.UK Notify client (checked at 77a030c3). The edge is recorded under refuted_edges.
      The variable is vestigial template configuration and can be deleted.
    affects: ["refuted: aqie-back-end -> GOV.UK Notify"]
  - id: oq-002
    question: "Which pipeline populates aqie-historicaldata-backend with source measurement data?"
    status: >-
      Answered — none. The service holds no historic measurements. It re-fetches
      observation XML from the public DEFRA UK-AIR INSPIRE Atom download service on
      demand for each extract, resolving site lists from Ricardo (AURN) or from a
      station master list in MongoDB (non-AURN). It stores only job state and
      reference data.
    affects: ["historicaldata-backend__ukair-atom"]
  - id: oq-003
    question: "Should aqie-kpi-metrics-dashboard be completed with a real data source, or archived?"
    status: "Answered — it has no data source and is a standalone browser-side prototype."
    affects: ["aqie-kpi-metrics-dashboard"]
  - id: oq-004
    question: "What does aqie-laqm-data-explorer's API_BASE_URL point at?"
    status: "Answered — the external LAQM Portal API at www.laqmportal.co.uk."
    affects: ["laqm-data-explorer__laqm-portal"]
  - id: oq-005
    question: "Which service owns subscriber state, aqie-alert-back-end-service or aqie-notify-service?"
    status: >-
      Answered — the alert backend owns subscriber state (USERS collection); the
      notify service owns only the messaging edge and is the sole holder of the
      GOV.UK Notify key. Unsubscribe is asymmetric: SMS opt-out routes through
      notify, email opt-out routes through the front end. Confirm that is intended.
    affects: ["notify-service__alert-backend", "alert-backend__notify-service"]
  - id: oq-006
    question: >-
      Is the public smoke control register currently broken? aqie-dc-frontend calls
      /get-all/{type} and /get/{type}/{id}, neither of which aqie-dc-backend serves
      on main.
    status: >-
      Still open, unchanged. Re-confirmed 2026-11-19 at aqie-dc-backend 49f950cd and
      aqie-dc-frontend 0100dc25 (unchanged since 2026-04-21). The backend still registers
      neither route, and the shapes differ (the appliance summary carries permittedFuels
      where the frontend reads fuels), so a fix needs both a route change and a
      response-shape change. The backend's public lists now return live items only, which
      suggests it is being shaped for a public frontend (see oq-026).
    severity: high
    affects: ["dc-frontend__dc-backend"]
  - id: oq-007
    question: "Who operates the LAQM Portal API, and what is the data-sharing basis for the AQIE partner credentials?"
    status: >-
      Still open, widened 2026-11-19. aqie-historicaldata-backend also holds LAQM partner
      credentials (LAQM_API_KEY, LAQM_USERID), so three services now use the portal under
      the same arrangement.
    affects: ["laqm-data-explorer__laqm-portal", "dataselector-frontend__laqm-portal", "historicaldata-backend__laqm-portal"]
  - id: oq-008
    question: "Is OpenFreeMap acceptable as a production dependency for citizen-facing maps?"
    affects: ["maps-frontend__openfreemap"]
  - id: oq-009
    question: >-
      Is GET or POST correct for /osnameplaces and /monitoringstation? Service
      config and performance test plans disagree.
    status: >-
      Answered — POST. At the pinned HEADs aqie-location-backend registers only
      POST /osnameplaces, and aqie-monitoringstation-backend registers POST
      /monitoringstation (plus a leftover GET /osnameplaces and the new
      GET /monitoringstation/by-location). Its callers (aqie-monitoringstation-backend,
      aqie-dataselector-frontend and aqie-prtr-backend) all use POST with a JSON body. The
      GET path-parameter forms (/monitoringstation/location=... and
      /osnameplaces/userLocation=...) were replaced under ticket aqd-727 in August 2025.
      The performance test plans still use them and would return 404, and the perf-test
      OSPlace_API_URL still carries the old path per CDP environment configuration.
    affects: ["monitoringstation-backend__location-backend", "dataselector-frontend__location-backend"]
  - id: oq-010
    question: >-
      Who produces and uploads the annual uk_prtr_dataset_<year>.xml files to S3,
      and who runs the manual TSV ingest that populates the PRTR facility data?
    status: >-
      Partly answered 2026-11-19. The files reach S3 through the CDP Uploader (the
      encodedfilename metadata key that aqie-prtr-backend matches is written by that
      uploader, and its object keys are uploadId/fileId pairs), and the TSV ingest is
      described in its own code as a one-shot migration. Still unknown: which service or
      person initiates the uploads (no PRTR repository on main calls the uploader), who
      produces the XML, whether the TSV ingest has been run since the first load, and how
      a new reporting year (2025 is listed but not live) will reach the register.
    affects: ["prtr-backend__s3"]
  - id: oq-011
    question: >-
      Was an information governance assessment or DPIA completed for sending DEFRA
      business case text to Azure OpenAI and AWS Bedrock in the document analysis
      proof of concept?
    severity: high
    affects: ["docanalysispoc-backend__model-providers"]
  - id: oq-012
    question: >-
      Which Ricardo host is authoritative for production? aqie-back-end defaults to
      uk-air-api.staging.rcdo.co.uk, while aqie-alert-back-end-service,
      aqie-historicaldata-backend and aqie-demo-data-visualisations use
      api-ukair.defra.gov.uk.
    status: >-
      Partly answered 2026-11-19, and the earlier reading is reversed. For aqie-back-end the
      answer is the production host: per CDP environment configuration all four Ricardo URL
      variables are set in the service-wide defaults, none is overridden in any environment
      file, none points at the supplier's staging host, and each resolves to the host
      documented in the repository's .env.example. A secret of the same name would override
      these and cannot be seen from that configuration. The staging host survives as a code
      default (src/config/index.js, lines 266-290), so removing a variable would silently
      select staging; the fix is to make the four URLs required. The earlier documentation
      said production did not override the defaults, which was wrong. aqie-historicaldata-backend
      fixes the production host in code with no override (so it would not follow a change of
      host in configuration), and aqie-demo-data-visualisations defaults to it. The
      configuration of aqie-alert-back-end-service was not re-read this cycle.
    severity: low
    affects: ["back-end__ricardo", "alert-backend__ricardo", "historicaldata-backend__ricardo", "demo-visualisations__ricardo"]
  - id: oq-013
    question: >-
      Does aqie-front-end have a sixth outbound edge via SUBSCRIPTION_API_BASE_URL?
      It has no default and the feature is off by default.
    status: >-
      Answered 2026-11-19 for the deployed estate; the code path exists. aqie-front-end can
      post a captured email address or mobile number to a configurable service
      (POST /capture/email and /capture/sms) when SUBSCRIPTION_API_ENABLED is true and
      SUBSCRIPTION_API_BASE_URL is not empty. Per CDP environment configuration,
      SUBSCRIPTION_API_ENABLED, SUBSCRIPTION_API_BASE_URL, SUBSCRIPTION_API_KEY,
      SUBSCRIPTION_API_EMAIL_PATH and SUBSCRIPTION_API_SMS_PATH are unset in every
      environment's app config, so the code defaults apply (disabled, no base URL) everywhere;
      secrets are held separately and were not visible. No AQIE service exposes /capture/*.
      So there is no sixth edge in the deployed estate. The owner can delete the feature or
      name the intended target.
    affects: ["aqie-front-end"]
  - id: oq-014
    question: >-
      Does aqie-monitoringstation-backend still resolve RICARDO_API_URL to
      /monitoringStationInfo in every environment? The /measurements alternative has now
      been decommissioned, so any environment still pointing at it is broken.
    status: >-
      Answered — yes. Every default and code path in aqie-monitoringstation-backend
      ad63bb7 targets aqie-back-end GET /monitoringStationInfo; the only /measurements
      string left is a commented-out default. RICARDO_API_URL is not set in any
      environment per CDP environment configuration, so the code default applies. A stale
      MEASUREMENTS_API_URL pointing at /measurements is still set per CDP environment
      configuration but has not been read since 2026-03-16; it should be retired.
      Residual risk is low.
    affects: ["monitoringstation-backend__back-end"]
  - id: oq-015
    question: >-
      aqie-front-end is configured with a getSubscriptionsPath of /api/subscriptions
      against the alert backend, but no such route exists there. Is this dead config or
      a missing endpoint?
    status: >-
      Changed 2026-11-19; still open and narrower. It is a live call, not dead configuration.
      In the SMS journey only, aqie-front-end requests
      GET {ALERT_BACKEND_BASE_URL}/api/subscriptions/{phone}?alertType=sms to count a phone
      number's subscriptions. The alert backend at e6ff1414 (unchanged since 2026-08-10)
      registers only /health, /setup-alert, /opt-out-sms-alert, /opt-out-email-alert,
      /aqsr-alert, /daqi-alert and the template /example routes, so the call cannot succeed.
      The front end treats any reply other than 200 or 400 as unexpected and fails open, so
      the SMS journey skips the maximum-locations check at that step. Per CDP environment
      configuration NOTIFY_ENABLED is true in every environment, ALERT_BACKEND_BASE_URL and
      NOTIFY_BASE_URL are set everywhere, and NOTIFY_GET_SUBSCRIPTIONS_PATH is unset
      everywhere, so the default path is the one called. The email journey skips the call;
      its code comments say the limit of five is enforced when POST /setup-alert returns 400.
      Remaining question for the owners: add the missing route to the alert backend, or
      remove the SMS call and rely on the 400, as the email journey does?
    severity: medium
    affects: ["front-end__alert-backend"]
  - id: oq-016
    question: >-
      Should the USE_NEW_RICARDO_MEASUREMENTS_ENABLED flag, the MEASUREMENTS_API_URL
      variable and the dead branch that reads it be retired from aqie-front-end, now that
      the /measurements endpoint they refer to has been removed?
    status: >-
      Answered 2026-11-19 and reframed: the flag is vestigial, not a broken rollback path.
      The old URL cannot be reached at runtime. The English journey hard-codes the new
      source and the shared fetch forces it for any non-boolean argument; the flag only
      selects the response parser in the Welsh journey. Setting it false would not call the
      removed endpoint, but by reading the code (not run) it would hand the new response to
      the legacy parser and most likely fail the Welsh location page with an HTTP 500.
      Per CDP environment configuration the flag is true in every environment (set
      explicitly), and MEASUREMENTS_API_URL and NEW_RICARDO_MEASUREMENTS_API_URL are both
      set in every environment, so production uses the new source. Yes, it can be
      retired: delete the flag, MEASUREMENTS_API_URL, buildOldMeasurementsSelection,
      fetchLegacyNearestLocationsRange and the unused fetch-data-core-helpers.js, and
      remove the variable from the platform configuration. Not yet done at 210c0c03.
    severity: low
    affects: ["front-end__back-end"]
  - id: oq-017
    question: >-
      aqie-maps-frontend falls back to aqie-back-end GET /forecasts when
      AQIE_FORECAST_API_URL is unset. That endpoint has been removed. Is the fallback
      reachable in any deployed environment, and should it be deleted?
    status: >-
      Partly answered 2026-11-19. Not reachable: per CDP environment configuration
      AQIE_FORECAST_API_URL is set in every environment the service is deployed to. It
      should still be deleted, because the dead fallback is in code at 13a9eb7f
      (src/server/common/helpers/aqie-forecast-api.js, line 12). Related and open: the
      forecast view has no controls in the page templates (the tab was hidden on purpose
      until the design is ready) yet /api/forecasts is fetched on every map load; if the
      forecast view is not returning, removing that fetch settles this question too.
    severity: low
    affects: ["maps-frontend__back-end"]
  - id: oq-018
    question: >-
      As raised on 2026-09-23: aqie-demo-data-visualisations still called the removed
      /measurements endpoint and was the only publisher-consumer of the feature-of-interest
      mapping, which /monitoringStationInfo does not provide. Is the repository still in
      use, and if so what replaces that mapping?
    status: >-
      Answered 2026-11-19. The demo no longer calls /measurements or any aqie-back-end
      endpoint. PR #15 (merged 2026-10-07) removed that client and the Sensor Observation
      Service client, and the demo now reads the Ricardo UK-AIR API directly with its own
      credentials (demo-visualisations__ricardo). The feature-of-interest mapping is no
      longer needed, so nothing replaces it, and the repository is still being changed.
      Per CDP environment configuration, in the dev environment the three
      RICARDO_API_*_URL variables are set, AQIE_BACK_END_URL is still set but read nowhere,
      and SOS_URL is unset. Whose Ricardo account the demo uses is raised as oq-039.
    affects: ["demo-visualisations__ricardo"]
  - id: oq-019
    question: >-
      pollutantsScheduler and forecastScheduler are registered in aqie-back-end
      (src/api/server.js) and still write measurements and forecasts (rewritten in place,

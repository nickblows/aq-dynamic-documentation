      the DEFRA Sensor Observation Service (sos-history.js and the XML parser dependency
      were deleted); hourly readings now come from the Ricardo UK-AIR API.
    residual_risk: "None. The DEFRA SOS feed is unaffected and is still read by aqie-back-end (back-end__defra-sos)."

  - id: privatebeta-api-perftest__back-end

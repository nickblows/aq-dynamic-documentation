# ---------------------------------------------------------------------------
# Datastores owned by services (not edges between services)
# ---------------------------------------------------------------------------
service_datastores:
  - service: aqie-back-end
    stores: ["MongoDB"]
    notes: "Ingested Ricardo and forecast data; distributed locking via mongo-locks."
  - service: aqie-forecast-api
    stores: ["MongoDB"]
    notes: "Parsed Met Office forecast documents."
  - service: aqie-location-backend
    stores: ["MongoDB"]
  - service: aqie-monitoringstation-backend
    stores: ["MongoDB"]
  - service: aqie-alert-back-end-service
    stores: ["MongoDB", "Redis"]
    notes: "Subscriber records and alert dispatch state."
  - service: aqie-notify-service
    stores: ["MongoDB", "Redis"]
    notes: "Subscription lifecycle, OTP and link validation state."
  - service: aqie-dc-backend
    stores: ["MongoDB", "Redis", "AWS S3", "AWS SQS"]
    notes: "Appliance/fuel registers, applications, uploaded evidence, async message handling."
  - service: aqie-prtr-backend
    stores: ["MongoDB", "AWS S3"]
    notes: "Facility records; generated report files in S3."
  - service: aqie-historicaldata-backend
    stores: ["MongoDB", "AWS S3", "Redis"]
    notes: "Historic measurement extracts staged to S3 and delivered via pre-signed URLs."
  - service: aqie-front-end
    stores: ["Redis"]
    notes: "Session and response caching only (catbox-redis, yar)."
  - service: aqie-dataselector-frontend
    stores: ["Redis"]
    notes: >-
      Session state only. AWS SDK packages are declared in package.json but not
      imported; the service only follows pre-signed URLs handed to it.

# ---------------------------------------------------------------------------
# Edges that were asserted but disproved. Recorded so they are not re-added.
# ---------------------------------------------------------------------------
refuted_edges:
  - claim: "aqie-dataselector-frontend -> cdp-uploader"
    verdict: refuted
    reason: >-
      CDP_UPLOADER_URL and AWS_S3_BUCKET_NAME are defined in config but read
      nowhere. There is no upload route, no multipart handler and no file input
      in any template. The config block is dead, copied from the document
      analysis proof of concept along with unused langchain, pdf2json, xlsx and
      aws-sdk dependencies.
    checked_at_utc: "2026-09-15T00:00:00Z"

  - claim: "aqie-maps-frontend -> aqie-back-end GET /measurements"
    verdict: refuted
    reason: "Full-text search of src/ (excluding tests) returns no call site."
    checked_at_utc: "2026-09-15T00:00:00Z"

  - claim: "aqie-dc-backend -> GOV.UK Notify or aqie-notify-service"
    verdict: refuted
    reason: "No Notify dependency, no NOTIFY_* variable and no outbound URL in the repository."
    checked_at_utc: "2026-09-15T00:00:00Z"

  - claim: "aqie-dc-backend as an SQS producer"
    verdict: refuted
    reason: "The service only receives and deletes messages. No SendMessageCommand exists."
    checked_at_utc: "2026-09-15T00:00:00Z"

  - claim: "aqie-kpi-metrics-dashboard -> any AQIE data source"
    verdict: refuted
    reason: >-
      The metrics controller returns literal empty objects. All calculation is
      client-side over a user-uploaded spreadsheet, persisted to localStorage.
      No API client and no database.
    checked_at_utc: "2026-09-15T00:00:00Z"

# ---------------------------------------------------------------------------
# Known gaps requiring owner confirmation
# ---------------------------------------------------------------------------
open_questions:
  - id: oq-001
    question: "Does aqie-back-end still send notifications directly, or is this fully delegated to aqie-notify-service?"
    affects: ["back-end__govuk-notify"]
  - id: oq-002
    question: "Which pipeline populates aqie-historicaldata-backend with source measurement data?"
    status: >-
      Answered — none. The service holds no historic measurements. It re-fetches
      observation XML from the public DEFRA UK-AIR INSPIRE Atom download service on
      demand for each extract, resolving site lists from Ricardo (AURN) or from a
      station master list in MongoDB (non-AURN). It stores only job state and
      reference data.
    affects: ["historicaldata-backend__ukair-atom"]
  - id: oq-003
    question: "Should aqie-kpi-metrics-dashboard be completed with a real data source, or archived?"
    status: "Answered — it has no data source and is a standalone browser-side prototype."
    affects: ["aqie-kpi-metrics-dashboard"]
  - id: oq-004
    question: "What does aqie-laqm-data-explorer's API_BASE_URL point at?"
    status: "Answered — the external LAQM Portal API at www.laqmportal.co.uk."
    affects: ["laqm-data-explorer__laqm-portal"]
  - id: oq-005
    question: "Which service owns subscriber state, aqie-alert-back-end-service or aqie-notify-service?"
    status: >-
      Answered — the alert backend owns subscriber state (USERS collection); the
      notify service owns only the messaging edge and is the sole holder of the
      GOV.UK Notify key. Unsubscribe is asymmetric: SMS opt-out routes through
      notify, email opt-out routes through the front end. Confirm that is intended.
    affects: ["notify-service__alert-backend", "alert-backend__notify-service"]
  - id: oq-006
    question: >-
      Is the public smoke control register currently broken? aqie-dc-frontend calls
      /get-all/{type} and /get/{type}/{id}, neither of which aqie-dc-backend serves
      on main.
    severity: high
    affects: ["dc-frontend__dc-backend"]
  - id: oq-007
    question: "Who operates the LAQM Portal API, and what is the data-sharing basis for the AQIE partner credentials?"
    affects: ["laqm-data-explorer__laqm-portal", "dataselector-frontend__laqm-portal"]
  - id: oq-008
    question: "Is OpenFreeMap acceptable as a production dependency for citizen-facing maps?"
    affects: ["maps-frontend__openfreemap"]
  - id: oq-009
    question: >-
      Is GET or POST correct for /osnameplaces and /monitoringstation? Service
      config and performance test plans disagree.
    affects: ["monitoringstation-backend__location-backend", "dataselector-frontend__location-backend"]
  - id: oq-010
    question: >-
      Who produces and uploads the annual uk_prtr_dataset_<year>.xml files to S3,
      and who runs the manual TSV ingest that populates the PRTR facility data?
    affects: ["prtr-backend__s3"]
  - id: oq-011
    question: >-
      Was an information governance assessment or DPIA completed for sending DEFRA
      business case text to Azure OpenAI and AWS Bedrock in the document analysis
      proof of concept?
    severity: high
    affects: ["docanalysispoc-backend__model-providers"]
  - id: oq-012
    question: >-
      Which Ricardo host is authoritative for production? aqie-back-end defaults to
      uk-air-api.staging.rcdo.co.uk while aqie-alert-back-end-service defaults to
      api-ukair.defra.gov.uk.
    severity: high
    affects: ["back-end__ricardo", "alert-backend__ricardo"]
  - id: oq-013
    question: >-
      Does aqie-front-end have a sixth outbound edge via SUBSCRIPTION_API_BASE_URL?
      It has no default and the feature is off by default.
    affects: ["aqie-front-end"]
  - id: oq-014
    question: >-
      Does aqie-monitoringstation-backend call /monitoringStationInfo or /measurements
      in each environment? The endpoint is supplied by the overridable RICARDO_API_URL
      variable and the alternative is present but commented out in source.

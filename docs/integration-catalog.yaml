decommissioned_edges:
  - id: front-end__back-end__measurements
    claim: "aqie-front-end -> aqie-back-end GET /measurements"
    decommissioned_by: "aqie-back-end PR #163"
    decommissioned_at_utc: "2026-09-23T00:00:00Z"
    reason: >-
      Superseded by GET /monitoringStationInfo, which every runtime request in
      aqie-front-end now uses (see front-end__back-end). CDP logs showed no production
      traffic on /measurements before removal.
    residual_risk: >-
      Dead code remains in aqie-front-end at 210c0c03: MEASUREMENTS_API_URL, the
      USE_NEW_RICARDO_MEASUREMENTS_ENABLED flag and the branch that reads the old URL
      (extracted/api-utils.js, buildOldMeasurementsSelection). No runtime caller can reach
      that branch, because the measurement fetch forces the new source for any non-boolean
      argument and the English controller hard-codes it. Setting the flag to false
      therefore does not call the removed endpoint. In the Welsh controller it would hand
      the new response object to the legacy parser, which by reading the code (not run)
      fails, so the Welsh location page would most likely return an HTTP 500.
      MEASUREMENTS_API_URL is still listed in the committed .env.production and
      .env.perf-test templates. See oq-016.

  - id: maps-frontend__back-end__forecasts
    claim: "aqie-maps-frontend -> aqie-back-end GET /forecasts"
    decommissioned_by: "aqie-back-end PR #163"
    decommissioned_at_utc: "2026-09-23T00:00:00Z"
    reason: >-
      Fallback path used only when AQIE_FORECAST_API_URL was unset. The primary path is
      aqie-forecast-api GET /forecast, which is unaffected.
    residual_risk: >-
      The fallback code is still present at aqie-maps-frontend 13a9eb7f
      (src/server/common/helpers/aqie-forecast-api.js, line 12) and would now 404 if
      AQIE_FORECAST_API_URL were unset. Checked 2026-11-19: per CDP environment

# AQIE Integration Catalogue
#
# Single source of truth for service-to-service and service-to-external edges.
# Diagrams under /docs/diagrams are generated from this file — edit here, not there.
#
# Evidence policy:
#   Every integration MUST cite evidence (repo + file + line) taken from the
#   default branch of the source repository. Test fixtures and mock URLs are NOT
#   acceptable evidence. Where an edge is asserted without code evidence it MUST
#   be marked confidence: provisional and carry an open question.
#
# Security policy:
#   Record authentication MECHANISM and credential VARIABLE NAMES only.
#   Never record credential values, tokens, keys or endpoints containing secrets.
#   A statement taken from private deployment configuration (not from a default branch)
#   is limited to variable names and set, unset or true/false states, and is tagged
#   "per CDP environment configuration".

catalog_version: 1
updated_at_utc: "2026-11-19T00:00:00Z"
analysis_branch_policy: "main-only"

confidence_levels:
  confirmed: "Endpoint and caller identified in non-test source on the default branch"
  provisional: "Edge indicated by configuration key or naming, target not fully verified"
  inferred: "Edge assumed from architecture/topology, requires owner confirmation"

target_kinds:
  aqie-service: "Another repository in this catalogue"
  external: "Third-party or cross-government system outside AQIE"
  datastore: "Backing store owned by the source service"
  platform: "DEFRA CDP shared platform capability"

# ---------------------------------------------------------------------------
# External and platform systems referenced by AQIE services
# ---------------------------------------------------------------------------
external_systems:
  - id: ricardo-ukair
    name: "Ricardo UK-AIR API"
    owner: "Ricardo Energy & Environment (on behalf of DEFRA)"
    description: >-
      Authoritative source for UK air quality monitoring station metadata and
      pollutant measurement data (AURN and affiliated networks).
    hosts:
      - "uk-air-api.staging.rcdo.co.uk"
      - "api-ukair.defra.gov.uk"
    auth: "Login endpoint exchanges credentials for a bearer token"
    credential_vars: ["RICARDO_API_EMAIL", "RICARDO_API_PASSWORD", "RICARDO_API_KEY", "RICARDO_API_VALUE"]

  - id: ukair-website
    name: "DEFRA UK-AIR public website"
    owner: "DEFRA"
    description: >-
      Public UK-AIR site. aqie-back-end reads its forecast RSS feed
      (/assets/rss/forecast.xml) on a schedule. No AQIE service fetches the national
      forecast text summary page; the setting in aqie-front-end for it is unused (see the
      refuted edge).
    hosts: ["uk-air.defra.gov.uk"]
    auth: "None (public endpoint)"

  - id: ukair-atom
    name: "DEFRA UK-AIR INSPIRE Atom download service"
    owner: "DEFRA"
    description: >-
      Public INSPIRE-compliant Atom download service publishing historic fixed
      observation data as OM-SWE XML, per site and per year.
    hosts: ["uk-air.defra.gov.uk/data/atom-dls"]
    auth: "None (public endpoint)"

  - id: os-names
    name: "Ordnance Survey Names API"
    owner: "Ordnance Survey"
    description: "Place-name and gazetteer search used to resolve user location input."
    hosts: ["api.os.uk"]
    auth: "API key (aqie-front-end sends it as a query-string parameter)"
    credential_vars: ["OS_NAMES_API_KEY", "OSPLACE_API_KEY"]

  - id: postcodes-io
    name: "postcodes.io"
    owner: "Ideal Postcodes (open service)"
    description: >-
      Postcode, outcode and place-name geocoding (aqie-demo-data-visualisations) and
      reverse geocoding of coordinates to postcode and local authority (aqie-back-end).
    hosts: ["api.postcodes.io"]
    auth: "None (public endpoint)"

  - id: govuk-notify
    name: "GOV.UK Notify"
    owner: "GDS"
    description: "Transactional email and SMS delivery for air quality alerts."
    hosts: ["api.notifications.service.gov.uk"]
    auth: "API key"
    credential_vars: ["NOTIFY_API_KEY"]

  - id: met-office-sftp
    name: "Met Office forecast SFTP"
    owner: "Met Office (files); hosting service operator to be confirmed"
    description: >-
      Drop of air quality forecast files collected over SFTP. aqie-forecast-api collects
      it on a schedule. aqie-back-end reads it on request through an HTTP CONNECT tunnel
      on the CDP proxy; its host, account and directory are hard-coded in source.
    protocol: "SFTP"
    auth: "SSH private key"
    credential_vars: ["SSH_PRIVATE_KEY", "MET_OFFICE_DIRECTORY"]

  - id: azure-entra
    name: "Microsoft Entra ID"
    owner: "DEFRA IT"
    description: >-
      Identity provider used for staff sign-in to the smoke control caseworker interface
      (authorisation code flow) and for a client-credentials token that
      aqie-front-end uses to call the Northern Ireland OS Places lookup.
    hosts: ["login.microsoftonline.com"]
    auth: "OpenID Connect / MSAL (staff sign-in); OAuth2 client credentials (token for the NI lookup)"
    credential_vars: ["AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET", "OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_ID", "OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_SECRET", "OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_SCOPE", "OAUTH_TOKEN_NORTHERN_IRELAND_API_TENANT_ID"]

  - id: qualtrics
    name: "Qualtrics"
    owner: "DEFRA (survey tenant)"
    description: >-
      User feedback and research sign-up surveys linked from citizen-facing pages: the
      alert success pages in aqie-front-end and the beta banner in
      aqie-dataselector-frontend.
    hosts: ["defragroup.eu.qualtrics.com"]
    auth: "None (outbound link only)"

  - id: cdp-uploader
    name: "CDP Uploader"
    owner: "DEFRA Core Delivery Platform"
    kind: platform
    description: >-
      Shared CDP service providing virus-scanned file upload with callback
      notification to the owning service.
    hosts: ["cdp-uploader.<env>.cdp-int.defra.cloud"]
    auth: "Platform-internal network"

  - id: laqm-portal
    name: "LAQM Portal API"
    owner: "Operator unconfirmed — see oq-007"
    description: >-
      Local Air Quality Management portal providing local authority reference
      data, declared air quality management areas and annual status report data.
    hosts: ["www.laqmportal.co.uk"]
    auth: "X-API-Key and X-API-PartnerId headers"
    credential_vars: ["LAQM_API_KEY", "LAQM_USERID", "LAQMAPIKEY", "LAQMAPIPARTNERID"]

  - id: defra-sos
    name: "DEFRA Sensor Observation Service (SOS)"
    owner: "DEFRA"
    description: >-
      Public OGC Sensor Observation Service exposing historic hourly air quality
      observations for UK monitoring sites, plus the public site and feature-of-interest
      listing API (/data/API/site-process-featureofinterest-by-region) that aqie-back-end
      sweeps hourly.
    hosts: ["uk-air.defra.gov.uk/sos-ukair", "uk-air.defra.gov.uk/data/API"]
    auth: "None (public endpoint)"

  - id: os-places-ni
    name: "Ordnance Survey Places (Northern Ireland)"
    owner: "Ordnance Survey"
    description: "Northern Ireland postcode lookup, authenticated with an Entra ID client-credentials token."
    # hosts: not visible in source. aqie-front-end reads the URL from
    # OS_PLACES_POSTCODE_NORTHERN_IRELAND_URL, which has no default; the earlier entry of
    # api.os.uk was unverified and has been removed.
    auth: "OAuth2 bearer token obtained from Microsoft Entra ID"
    credential_vars: ["OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_ID", "OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_SECRET", "OS_PLACES_POSTCODE_NORTHERN_IRELAND_CLIENT_SCOPE", "OAUTH_TOKEN_NORTHERN_IRELAND_API_TENANT_ID"]

  - id: openfreemap
    name: "OpenFreeMap"
    owner: "Third party (open source tile service)"
    description: "Browser-side vector map tiles and styles for interactive maps."
    hosts: ["tiles.openfreemap.org"]
    auth: "None (public endpoint)"

  - id: google-tag-manager
    name: "Google Tag Manager / Google Analytics"
    owner: "DEFRA analytics tenant"
    description: "Browser-side usage analytics, loaded only after cookie consent."
    hosts: ["googletagmanager.com", "google-analytics.com", "analytics.google.com"]
    auth: "None (measurement ID)"

  - id: jquery-cdn
    name: "jQuery CDN"
    owner: "jQuery project (OpenJS Foundation)"
    description: "Public content delivery network that serves the jQuery library to the citizen's browser."
    hosts: ["code.jquery.com"]
    auth: "None (public endpoint). The script tag carries a subresource integrity hash"

  - id: defra-forms
    name: "DEFRA Forms"
    owner: "DEFRA Forms team"
    description: >-
      Cross-government form builder. Publishes smoke control application
      submissions onto an SQS queue consumed by aqie-dc-backend.
    protocol: "AWS SQS"
    auth: "IAM task role"

  - id: model-providers
    name: "Azure OpenAI and AWS Bedrock"
    owner: "DEFRA (Azure tenant) / AWS"
    description: >-
      Large language model providers used by the archived document analysis
      proof of concept for business case summarisation.
    auth: "API key or IAM"
    credential_vars: ["OPEN_AI_KEY", "AZURE_CLIENT_SECRET", "BEARER_TOKEN_BEDROCK"]

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:

  # --- Core citizen journey -------------------------------------------------
  - id: front-end__back-end
    source: aqie-front-end
    target: aqie-back-end
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Retrieve live pollutant measurements and monitoring station detail for the location the citizen searched."
    endpoints:
      - method: GET
        path: /monitoringStationInfo
        data: "Searched coordinates, distance and station-count limits in; live per-station pollutant concentrations, station metadata and coordinates out"
    auth: "CDP internal network; no application-level auth observed"
    confidence: confirmed
    notes: >-
      Every runtime request uses NEW_RICARDO_MEASUREMENTS_API_URL. The English controller
      hard-codes the new source and the shared fetch forces it for any non-boolean
      argument, so the legacy /measurements URL (MEASUREMENTS_API_URL) is read only by a
      branch that no runtime caller can reach. USE_NEW_RICARDO_MEASUREMENTS_ENABLED
      (default true; true in every environment per CDP environment configuration) only
      selects the response parser in the Welsh controller. The former /measurements edge
      was removed when aqie-back-end PR #163 decommissioned that endpoint. Checked at
      aqie-front-end 210c0c03. See oq-016.
    evidence:
      - repo: aqie-front-end
        file: src/server/locations/helpers/get-nearest-location.js
        lines: "260-322"
      - repo: aqie-front-end
        file: src/server/locations/helpers/fetch-data.js
        lines: "152-171,218-254"
      - repo: aqie-front-end
        file: src/server/locations/helpers/extracted/api-utils.js
        lines: "239-257,331-369,425-439"
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "415-420"

  - id: front-end__forecast-api
    source: aqie-front-end
    target: aqie-forecast-api
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Retrieve the multi-day air quality forecast, and the daily forecast summary text, shown on location pages."
    endpoints:
      - method: GET
        path: /forecast
        data: "Forecast DAQI values by day and region, plus the forecast-summary narrative"
    auth: "CDP internal network; x-api-key (CDP_X_API_KEY family) only when a localhost request is routed through the protected gateway"
    confidence: confirmed
    notes: >-
      The national forecast narrative on location pages is the forecast-summary field of
      this response. The front end has no call site for the UK-AIR website summary (see
      refuted edge aqie-front-end -> UK-AIR website).
    evidence:
      - repo: aqie-front-end
        file: src/server/locations/helpers/extracted/api-utils.js
        lines: "13-32,71-129,204-237"
      - repo: aqie-front-end
        file: src/server/locations/helpers/fetch-data.js
        lines: "108-150,453-482"
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "357-362"

  - id: front-end__os-names
    source: aqie-front-end
    target: os-names
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Resolve free-text place names and postcodes entered by citizens into coordinates."
    endpoints:
      - method: GET
        path: /search/names/v1/find
        data: "Query, local-type filter and API key in the query string; gazetteer matches with coordinates out"
    auth: "API key carried as a query-string parameter (OS_NAMES_API_KEY)"
    confidence: confirmed
    notes: >-
      The shared proxy fetch helper logs the full request URL at info level, so the key is
      written to application logs on every lookup (finding 73).
    evidence:
      - repo: aqie-front-end
        file: src/server/locations/helpers/get-os-places.js
        lines: "75-117"
      - repo: aqie-front-end
        file: src/server/common/helpers/catch-proxy-fetch-error.js
        lines: "10-16,35-41,43-72"
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "248-260"

  - id: front-end__qualtrics
    source: aqie-front-end
    target: qualtrics
    target_kind: external
    protocol: HTTPS
    direction: outbound
    interaction: user-redirect
    purpose: "Link citizens to the user research sign-up form from the alert success pages."
    data_exchanged: "No service data; user follows an outbound link"
    auth: "None"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/server/notify/register/sms-success/controller.js
        lines: "122"
      - repo: aqie-front-end
        file: src/server/notify/register/alerts-success/controller.js
        lines: "119"
      - repo: aqie-front-end
        file: src/server/notify/register/alerts-success/index.njk
        lines: "32"
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "242-247"

  # --- Core data acquisition ------------------------------------------------
  - id: back-end__ricardo
    source: aqie-back-end
    target: ricardo-ukair
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: scheduled-batch
    purpose: "Refresh the monitoring station cache (every 6 hours and at start-up) and recalculate per-station DAQI from measurements (every 30 minutes)."
    endpoints:
      - method: POST
        path: /api/login_check
        data: "Credentials exchanged for bearer token, once per job run"
      - method: GET
        path: /api/site_meta_datas
        data: "Monitoring site metadata including closed sites (with-closed=true)"
      - method: GET
        path: /api/pollutant_metadatas
        data: "Per-station pollutant instrument records (start and end dates, status), paged, used to derive open and close dates and current pollutant coverage"
      - method: GET
        path: /api/pollutant_measurement_datas
        data: "Hourly and 15-minute pollutant readings per station for yesterday and today, paged, five stations at a time"
    schedule_vars: ["AURN_SCHEDULE", "MONITORING_STATIONS_SCHEDULE"]
    auth: "Username/password login exchanged for bearer token"
    confidence: confirmed
    notes: >-
      Code defaults for all four Ricardo URLs point at the supplier's staging host; see
      oq-012. Station cache population also runs once on the hapi start event (no lock
      taken). The pollutant_metadatas page fetch uses plain fetch rather than the proxy
      helper. POLLUTANTS_SCHEDULE is not a Ricardo schedule: it drives the UK-AIR SOS
      pipeline (back-end__defra-sos).
    evidence:
      - repo: aqie-back-end
        file: src/config/index.js
        lines: "223-234,266-303"
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/oauth-helpers.js
        lines: "5-50"
      - repo: aqie-back-end
        file: src/api/aurn/fetch-aurn-measurements.js
        lines: "255-258,284,293"
      - repo: aqie-back-end
        file: src/api/aurn/aurn-scheduler.js
        lines: "14-16"
      - repo: aqie-back-end
        file: src/api/locationsite/fetch-monitoring-stations.js
        lines: "35-58,69-71"
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/fetch-station-dates.js
        lines: "79,227"
      - repo: aqie-back-end
        file: src/api/locationsite/monitoring-stations-scheduler.js
        lines: "17-19"
      - repo: aqie-back-end
        file: src/api/locationsite/db/populate-db.js
        lines: "12-16"

  - id: back-end__ricardo-live
    source: aqie-back-end
    target: ricardo-ukair
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Serve /monitoringStationInfo (current readings, 1 + 5N upstream calls) and /monitoringStationHistory (hourly series, 5 upstream calls per uncached request) by calling Ricardo on every request."
    endpoints:
      - method: POST
        path: /api/login_check
        data: "Credentials exchanged for bearer token when the caller's session has none"
      - method: GET
        path: /api/site_meta_datas
        data: "Station list for /monitoringStationInfo (allow-listed query parameters only)"
      - method: GET
        path: /api/pollutant_measurement_datas
        data: "One call per pollutant per station (info) or per pollutant for one station (history, with pollutant-name, start-date, end-date)"
    auth: "Username/password login exchanged for bearer token, cached in the caller's yar session"
    confidence: confirmed
    notes: >-
      No back-end timeout, no retries. /monitoringStationHistory caches successful
      responses in process for 15 minutes (500 entries); /monitoringStationInfo does not
      cache. See oq-031 on the request-time load.
    evidence:
      - repo: aqie-back-end
        file: src/api/locationsite/controller.js
        lines: "16-48"
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/fetch-ricardo-data-all.js
        lines: "44-60"
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/pollutant-helpers.js
        lines: "406-421"
      - repo: aqie-back-end
        file: src/api/locationsite/history-controller.js
        lines: "69-95"
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/fetch-pollutant-history.js
        lines: "91-99,126-132,164-171"

  - id: back-end__postcodes-io
    source: aqie-back-end
    target: postcodes-io
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: scheduled-batch
    purpose: "Resolve each station's coordinates to the owning local authority during the station cache refresh."
    endpoints:
      - method: GET
        path: /postcodes
        data: "lon, lat, radius=2000 and wideSearch in; admin_district of the first result out (5 second timeout, null on failure)"
    auth: "None"
    confidence: confirmed
    notes: "One concurrent lookup per station, via the CDP egress proxy helper since PR #166."
    evidence:
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/get-local-authority.js
        lines: "8-30"
      - repo: aqie-back-end
        file: src/api/locationsite/fetch-monitoring-stations.js
        lines: "86-88"

  - id: back-end__met-office
    source: aqie-back-end
    target: met-office-sftp
    target_kind: external
    protocol: SFTP
    direction: inbound-pull
    interaction: synchronous
    purpose: "On request, list and read forecast files held in a share on a DEFRA-named SFTP service."
    endpoints:
      - method: GET
        path: /sftp/files
        data: "Directory listing (this service's own route)"
      - method: GET
        path: /sftp/file/{filename}
        data: "One named file returned as XML (this service's own route)"
    auth: "SSH private key (SSH_PRIVATE_KEY); host, port, account name and remote directory are hard-coded in source"
    confidence: confirmed
    notes: >-
      Not scheduled and not stored. FORECAST_SCHEDULE belongs to back-end__ukair-website.
      The connection is an HTTP CONNECT tunnel through the CDP proxy (HTTP_PROXY). The
      routes have no authentication and no consumer is recorded in this catalogue (see
      security finding about the SFTP routes).
    evidence:
      - repo: aqie-back-end
        file: src/api/metOfficeForecast/index.js
        lines: "10-14,23-29"
      - repo: aqie-back-end
        file: src/api/metOfficeForecast/controllers/connectSftpViaProxy.js
        lines: "26-99"
      - repo: aqie-back-end
        file: src/api/metOfficeForecast/controllers/list-forecast.js
        lines: "16-32"
      - repo: aqie-back-end
        file: src/api/metOfficeForecast/controllers/read-forecast.js
        lines: "17-33,54-62"

  - id: back-end__defra-sos
    source: aqie-back-end
    target: defra-sos
    target_kind: external
    protocol: HTTPS/REST and OGC SOS
    direction: outbound
    interaction: scheduled-batch
    purpose: "Hourly sweep of 16 regions: read each region's site and feature-of-interest listing, then one SOS GetObservation per pollutant per site. Results are written to measurements and historicalMeasurements, which nothing reads since PR #163."
    endpoints:
      - method: GET
        path: /data/API/site-process-featureofinterest-by-region
        data: "Region id in; sites with feature-of-interest ids per pollutant out"
      - method: GET
        path: /sos-ukair/service?service=AQD&version=1.0.0&request=GetObservation
        data: "Temporal filter and feature of interest in; INSPIRE AQD XML observation out"
    schedule_vars: ["POLLUTANTS_SCHEDULE"]
    auth: "None (public endpoints)"
    confidence: confirmed
    notes: >-
      URLs come from POLLUTANTS_URL and POLLUTANTS_URL_EXTRA. Cron only; there is no run
      at start-up. Orphaned output since PR #163; see oq-019.
    evidence:
      - repo: aqie-back-end
        file: src/api/pollutants/helpers/get-api-pollutants.js
        lines: "5-8"
      - repo: aqie-back-end
        file: src/api/pollutants/helpers/pollutants-updater.js
        lines: "23,62-66"
      - repo: aqie-back-end
        file: src/api/pollutants/pollutants-scheduler.js
        lines: "16-18"
      - repo: aqie-back-end
        file: src/api/server.js
        lines: "83"

  - id: back-end__ukair-website
    source: aqie-back-end
    target: ukair-website
    target_kind: external
    protocol: HTTPS
    direction: outbound
    interaction: scheduled-batch
    purpose: "Fetch the UK-AIR forecast RSS feed and store parsed forecasts in forecasts and historicalForecasts, which nothing reads since PR #163."
    endpoints:
      - method: GET
        path: /assets/rss/forecast.xml
        data: "RSS items with location, publication date and a short per-day forecast"
    schedule_vars: ["FORECAST_SCHEDULE"]
    auth: "None (public endpoint)"
    confidence: confirmed
    notes: >-
      URL from FORECAST_URL. Runs on the cron schedule (default 05:00 to 10:00 hourly)
      and once on the hapi start event. Orphaned output since PR #163; see oq-019.
    evidence:
      - repo: aqie-back-end
        file: src/api/forecast/fetch-forecast.js
        lines: "9-19"
      - repo: aqie-back-end
        file: src/api/forecast/forecast-scheduler.js
        lines: "17-25"
      - repo: aqie-back-end
        file: src/api/server.js
        lines: "81"

  - id: forecast-api__met-office
    source: aqie-forecast-api
    target: met-office-sftp
    target_kind: external
    protocol: SFTP
    direction: inbound-pull
    interaction: scheduled-batch
    purpose: "Poll the Met Office directory for new forecast files, parse and persist them for the /forecast endpoint."
    data_exchanged: "XML forecast files parsed into forecast documents"
    schedule_vars: ["FORECAST_SCHEDULE", "FORECAST_RETRY_INTERVAL", "MET_OFFICE_DIRECTORY"]
    auth: "SSH private key"
    confidence: confirmed
    evidence:
      - repo: aqie-forecast-api
        file: src/forecast/batch-scheduler/runForecastSyncJob.js

  # --- Location and station resolution -------------------------------------
  - id: location-backend__os-names
    source: aqie-location-backend
    target: os-names
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Back the POST /osnameplaces endpoint with Ordnance Survey gazetteer search."
    endpoints:
      - method: GET
        path: /search/names/v1/find
        data: "Place-name or postcode text (query), a place-type filter (fq) and the API key (key) as query parameters in; matched gazetteer entries with coordinates out"
    auth: "API key"
    confidence: confirmed
    notes: >-
      The key is a query parameter (credential variable OS_NAMES_API_KEY) and the complete
      request URL, key included, is written to the application log (see the open questions
      in the service profile). Calls leave through the CDP egress proxy. The call is
      skipped, and an empty list returned, when the input contains any of the
      characters % $ & # ! ¬ or a backtick. The call is also skipped for blank input.

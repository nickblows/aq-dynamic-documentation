    decommissioned_by: "aqie-back-end PR #163"
    decommissioned_at_utc: "2026-09-23T00:00:00Z"
    reason: >-
      CDP logs showed no production traffic on /measurements across the log retention
      window, so the endpoint was removed.
    residual_risk: >-
      Resolved. aqie-demo-data-visualisations PR #15 (merged 2026-10-07) removed the
      aqie-back-end client and now reads station metadata and hourly readings directly
      from the Ricardo UK-AIR API (demo-visualisations__ricardo). It was not a migration

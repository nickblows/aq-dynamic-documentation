# ---------------------------------------------------------------------------
# Datastores owned by services (not edges between services)
# ---------------------------------------------------------------------------
service_datastores:
  - service: aqie-back-end
    stores: ["MongoDB"]
    notes: >-
      Collections: monitoringStations (Ricardo station cache), aurnMeasurements
      (per-station DAQI), measurements and historicalMeasurements (UK-AIR SOS pipeline),
      forecasts and historicalForecasts (UK-AIR forecast RSS), locks (ingest locks with a
      one hour TTL index). Since PR #163 nothing reads measurements,
      historicalMeasurements, forecasts or historicalForecasts. Locking is a hand-written
      insert into the locks collection; the mongo-locks package is instantiated but never
      used.
  - service: aqie-forecast-api
    stores: ["MongoDB"]
    notes: "Parsed Met Office forecast documents."
  - service: aqie-location-backend
    stores: ["MongoDB"]
    notes: >-
      Connected and indexed at start-up but holds no application data. The only collections
      are CDP template scaffolding: example-data (read by the scaffold GET /example routes)
      and mongo-locks (lock helper with no caller). The place-name path does not touch the
      database. Nothing is cached.
  - service: aqie-monitoringstation-backend
    stores: ["MongoDB"]
    notes: >-
      Database named by MONGO_DATABASE. The stations collection caches the Ricardo station
      list: upserted by station name at start-up and on STATIONS_SYNC_SCHEDULE (default
      every six hours), pruned of stations Ricardo no longer returns, with a TTL index on
      syncedAt (STATIONS_CACHE_TTL_SECONDS, default one week) as a backstop. mongo-locks
      holds the sync mutex. Read only by GET /monitoringstation/by-location; POST
      /monitoringstation does not touch MongoDB. No Redis or AWS use in application code.
  - service: aqie-alert-back-end-service
    stores: ["MongoDB"]
    notes: "Subscriber records and alert dispatch state. Redis appears only in the local compose file, not in the code or package manifest (checked at e6ff1414)."
  - service: aqie-notify-service
    stores: ["MongoDB"]
    notes: "Subscription lifecycle, OTP and link validation state. Redis appears only in the local compose file, not in the code or package manifest (checked at 1646e247)."
  - service: aqie-dc-backend
    stores: ["MongoDB", "AWS SQS"]
    notes: >-
      MongoDB holds the Appliances, Fuels, Applications, SqsMessages, Actions and
      ApplianceTypes collections (plus mongo-locks). SQS is consumed only: receive and
      batch delete, no producer. Redis appears only in compose.yml and the service opens
      no Redis connection. No S3 client call remains since 2026-10-27: the bucket named in
      configuration is the CDP Uploader's destination and is never read by this service.
  - service: aqie-dc-admin-frontend
    stores: ["Redis"]
    notes: >-
      Session state only. The yar session cache uses catbox-redis in production
      (catbox-memory elsewhere); the auth cookie is a stateless encrypted cookie that
      carries the signed-in user, not a Redis record. No database; every case read and
      write goes to aqie-dc-backend.
  - service: aqie-prtr-backend
    stores: ["MongoDB", "AWS S3"]
    notes: >-
      MongoDB holds the facility and report data loaded by the offline TSV ingest (written
      as a one-off migration). The S3 bucket holds the published annual dataset XML files,
      which the service only lists and pre-signs and never writes. The /reports year list
      is a static list in code, not read from MongoDB.
  - service: aqie-prtr-frontend
    stores: ["Redis"]
    notes: >-
      Session cache only (catbox-redis, yar): search text, candidate locations and form
      errors. No database. MongoDB appears only in the template Compose file.
  - service: aqie-prtr-submissions-backend
    stores: ["MongoDB"]
    notes: >-
      Template scaffold. Connects to its own database and holds only the mongo-locks and
      example-data collections. No submission data model on main.
  - service: aqie-prtr-submissions-frontend
    stores: ["Redis"]
    notes: >-
      Session cache only (catbox-redis, yar): the language preference. In-memory cache
      outside production.
  - service: aqie-historicaldata-backend
    stores: ["MongoDB", "AWS S3"]
    notes: >-
      Holds no historic measurements; every extract is rebuilt from the UK-AIR Atom
      download service. MongoDB: extract job and email job documents (aqie_csvexport_jobs,
      aqie_csvemailexport_jobs, the latter holding the citizen's email address), reference
      data seeded from S3 spreadsheets (aqie_atom_non_aurn_networks_pollutant_master,
      aqie_atom_non_aurn_networks_station_details), a start-up seed lock
      (aqie_atom_seed_locks) and the CDP template's "example" collection. S3: the two
      reference spreadsheets, and generated CSV and ZIP extracts delivered by seven-day
      pre-signed URL. No retention rule is expressed in code for jobs or extracts.
  - service: aqie-front-end
    stores: ["Redis"]
    notes: >-
      Server-side session store and response caches only (catbox-redis with ioredis in
      deployed environments, catbox-memory locally; the yar session cookie holds only the
      session id). The session holds the in-progress alert sign-up, including the
      citizen's email address or mobile number, for the session lifetime (default four
      hours). No database.
  - service: aqie-demo-data-visualisations
    stores: []
    notes: "None. In-process memory caches only (station list 6 hours, Ricardo bearer token 50 minutes)."
  - service: aqie-dataselector-frontend
    stores: ["Redis"]
    notes: >-
      Journey session state only: @hapi/yar over catbox-redis when SESSION_CACHE_ENGINE is
      redis (the production default), in-memory otherwise; four-hour TTL. A per-process
      in-memory cache also holds the LAQM local authority list for 12 hours. The AWS SDK
      packages were removed in Oct 2026; the service has no S3 client and only follows or
      checks pre-signed URLs handed to it by aqie-historicaldata-backend.
  - service: aqie-maps-frontend
    stores: ["Redis"]
    notes: >-
      Session cache engine only (catbox-redis in deployed environments, catbox-memory
      locally). The yar session plugin is registered but no route reads or writes a
      session, so nothing is currently stored. No database. The local compose.yml starts
      Redis and an AWS emulator, not MongoDB. Map view state is held in the citizen's
      browser sessionStorage.


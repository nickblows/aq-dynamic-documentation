    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Supply the station list and the observed AURN DAQI values to the interactive map."
    endpoints:
      - method: GET
        path: /monitoringStations
        data: "Full station list for map plotting and the station list panel"
      - method: GET
        path: /aurnData
        data: "Observed DAQI index per AURN station. Only localSiteID and daqiIndex are read; they colour the markers and fill the panel DAQI row. A station absent from the response is still plotted, grey and unnumbered"
      - method: GET
        path: /monitoringStationInfo
        data: "Per-station detail. Reached only through the proxy route GET /api/monitoring-station-info, which nothing in this repository calls"
    auth: "CDP internal network"
    confidence: confirmed
    notes: >-
      Does NOT call /measurements (see refuted_edges). The only "measurements" token in
      source is the property name in the /aurnData response. The map ignores measuredAt,
      updatedAt and the per-pollutant values in /aurnData, so the UTC ISO measuredAt
      format introduced by aqie-back-end PR #165 (2026-10-30) does not affect it. After
      PR #165's 75% data-capture rule, a station that has never had a calculable index is
      absent from the response; the map still plots it (grey, no number, "Not available"
      in the panel) and neither hides nor estimates it. A station that later fails the
      rule keeps its previous record in aqie-back-end, because nothing deletes it, so the
      map shows its old index as current with no age (see oq-030). A /forecasts fallback
      edge previously existed, used only when AQIE_FORECAST_API_URL is unset. That
      endpoint was decommissioned by aqie-back-end PR #163. The fallback code is still
      present at 13a9eb7f (src/server/common/helpers/aqie-forecast-api.js, line 12) but,
      per CDP environment configuration, AQIE_FORECAST_API_URL is set in every
      environment the service is deployed to, so it is not reached. See
      decommissioned_edges and oq-017. A 120000 ms client timeout is set on
      /monitoringStationInfo, reflecting the 1 + 5N upstream fan-out in that endpoint; the
      other calls use a 5000 ms timeout. The map page itself does not trigger
      /monitoringStationInfo: the browser requests only /api/monitoring-stations,
      /api/aurn-data and /api/forecasts.

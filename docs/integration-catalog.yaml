# AQIE Integration Catalogue
#
# Single source of truth for service-to-service and service-to-external edges.
# Diagrams under /docs/diagrams are generated from this file — edit here, not there.
#
# Evidence policy:
#   Every integration MUST cite evidence (repo + file + line) taken from the
#   default branch of the source repository. Test fixtures and mock URLs are NOT
#   acceptable evidence. Where an edge is asserted without code evidence it MUST
#   be marked confidence: provisional and carry an open question.
#
# Security policy:
#   Record authentication MECHANISM and credential VARIABLE NAMES only.
#   Never record credential values, tokens, keys or endpoints containing secrets.

catalog_version: 1
updated_at_utc: "2026-09-15T00:00:00Z"
analysis_branch_policy: "main-only"

confidence_levels:
  confirmed: "Endpoint and caller identified in non-test source on the default branch"
  provisional: "Edge indicated by configuration key or naming, target not fully verified"
  inferred: "Edge assumed from architecture/topology, requires owner confirmation"

target_kinds:
  aqie-service: "Another repository in this catalogue"
  external: "Third-party or cross-government system outside AQIE"
  datastore: "Backing store owned by the source service"
  platform: "DEFRA CDP shared platform capability"

# ---------------------------------------------------------------------------
# External and platform systems referenced by AQIE services
# ---------------------------------------------------------------------------
external_systems:
  - id: ricardo-ukair
    name: "Ricardo UK-AIR API"
    owner: "Ricardo Energy & Environment (on behalf of DEFRA)"
    description: >-
      Authoritative source for UK air quality monitoring station metadata and
      pollutant measurement data (AURN and affiliated networks).
    hosts:
      - "uk-air-api.staging.rcdo.co.uk"
      - "api-ukair.defra.gov.uk"
    auth: "Login endpoint exchanges credentials for a bearer token"
    credential_vars: ["RICARDO_API_EMAIL", "RICARDO_API_PASSWORD", "RICARDO_API_KEY"]

  - id: ukair-website
    name: "DEFRA UK-AIR public website"
    owner: "DEFRA"
    description: "Public UK-AIR site providing the national forecast text summary."
    hosts: ["uk-air.defra.gov.uk"]
    auth: "None (public endpoint)"

  - id: ukair-atom
    name: "DEFRA UK-AIR INSPIRE Atom download service"
    owner: "DEFRA"
    description: >-
      Public INSPIRE-compliant Atom download service publishing historic fixed
      observation data as OM-SWE XML, per site and per year.
    hosts: ["uk-air.defra.gov.uk/data/atom-dls"]
    auth: "None (public endpoint)"

  - id: os-names
    name: "Ordnance Survey Names API"
    owner: "Ordnance Survey"
    description: "Place-name and gazetteer search used to resolve user location input."
    hosts: ["api.os.uk"]
    auth: "API key"
    credential_vars: ["OS_NAMES_API_KEY", "OSPLACE_API_KEY"]

  - id: postcodes-io
    name: "postcodes.io"
    owner: "Ideal Postcodes (open service)"
    description: "Reverse geocoding of coordinates to postcode and local authority."
    hosts: ["api.postcodes.io"]
    auth: "None (public endpoint)"

  - id: govuk-notify
    name: "GOV.UK Notify"
    owner: "GDS"
    description: "Transactional email and SMS delivery for air quality alerts."
    hosts: ["api.notifications.service.gov.uk"]
    auth: "API key"
    credential_vars: ["NOTIFY_API_KEY"]

  - id: met-office-sftp
    name: "Met Office forecast SFTP"
    owner: "Met Office"
    description: "Scheduled drop of air quality forecast files collected over SFTP."
    protocol: "SFTP"
    auth: "SSH private key"
    credential_vars: ["SSH_PRIVATE_KEY", "MET_OFFICE_DIRECTORY"]

  - id: azure-entra
    name: "Microsoft Entra ID"
    owner: "DEFRA IT"
    description: "Staff authentication for internal admin interfaces."
    hosts: ["login.microsoftonline.com"]
    auth: "OpenID Connect / MSAL"

  - id: qualtrics
    name: "Qualtrics"
    owner: "DEFRA (survey tenant)"
    description: "User feedback survey linked from citizen-facing pages."
    hosts: ["defragroup.eu.qualtrics.com"]
    auth: "None (outbound link only)"

  - id: cdp-uploader
    name: "CDP Uploader"
    owner: "DEFRA Core Delivery Platform"
    kind: platform
    description: >-
      Shared CDP service providing virus-scanned file upload with callback
      notification to the owning service.
    hosts: ["cdp-uploader.<env>.cdp-int.defra.cloud"]
    auth: "Platform-internal network"

  - id: laqm-portal
    name: "LAQM Portal API"
    owner: "Operator unconfirmed — see oq-007"
    description: >-
      Local Air Quality Management portal providing local authority reference
      data, declared air quality management areas and annual status report data.
    hosts: ["www.laqmportal.co.uk"]
    auth: "X-API-Key and X-API-PartnerId headers"
    credential_vars: ["LAQM_API_KEY", "LAQMAPIKEY", "LAQMAPIPARTNERID"]

  - id: defra-sos
    name: "DEFRA Sensor Observation Service (SOS)"
    owner: "DEFRA"
    description: >-
      Public OGC Sensor Observation Service exposing historic hourly air quality
      observations for UK monitoring sites.
    hosts: ["uk-air.defra.gov.uk/sos-ukair"]
    auth: "None (public endpoint)"

  - id: os-places-ni
    name: "Ordnance Survey Places (Northern Ireland)"
    owner: "Ordnance Survey"
    description: "Northern Ireland postcode and address lookup, authenticated via Entra ID."
    hosts: ["api.os.uk"]
    auth: "OAuth2 bearer token obtained from Microsoft Entra ID"

  - id: openfreemap
    name: "OpenFreeMap"
    owner: "Third party (open source tile service)"
    description: "Browser-side vector map tiles and styles for interactive maps."
    hosts: ["tiles.openfreemap.org"]
    auth: "None (public endpoint)"

  - id: google-tag-manager
    name: "Google Tag Manager / Google Analytics"
    owner: "DEFRA analytics tenant"
    description: "Browser-side usage analytics, loaded only after cookie consent."
    hosts: ["googletagmanager.com"]
    auth: "None (measurement ID)"

  - id: defra-forms
    name: "DEFRA Forms"
    owner: "DEFRA Forms team"
    description: >-
      Cross-government form builder. Publishes smoke control application
      submissions onto an SQS queue consumed by aqie-dc-backend.
    protocol: "AWS SQS"
    auth: "IAM task role"

  - id: model-providers
    name: "Azure OpenAI and AWS Bedrock"
    owner: "DEFRA (Azure tenant) / AWS"
    description: >-
      Large language model providers used by the archived document analysis
      proof of concept for business case summarisation.
    auth: "API key or IAM"
    credential_vars: ["OPEN_AI_KEY", "AZURE_CLIENT_SECRET", "BEARER_TOKEN_BEDROCK"]

# ---------------------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------------------
integrations:

  # --- Core citizen journey -------------------------------------------------
  - id: front-end__back-end
    source: aqie-front-end
    target: aqie-back-end
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Retrieve pollutant measurements and monitoring station detail for the location the citizen searched."
    endpoints:
      - method: GET
        path: /measurements
        data: "Per-station pollutant concentrations and DAQI bands"
      - method: GET
        path: /monitoringStationInfo
        data: "Monitoring station metadata, coordinates, pollutants measured"
    auth: "CDP internal network; no application-level auth observed"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "412,418"

  - id: front-end__forecast-api
    source: aqie-front-end
    target: aqie-forecast-api
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Retrieve the multi-day air quality forecast shown on location pages."
    endpoints:
      - method: GET
        path: /forecast
        data: "Forecast DAQI values by day and region"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "360"

  - id: front-end__os-names
    source: aqie-front-end
    target: os-names
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Resolve free-text place names entered by citizens into coordinates."
    endpoints:
      - method: GET
        path: /search/names/v1/find
        data: "Query string in; gazetteer matches with coordinates out"
    auth: "API key"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "258"

  - id: front-end__ukair-website
    source: aqie-front-end
    target: ukair-website
    target_kind: external
    protocol: HTTPS
    direction: outbound
    interaction: synchronous
    purpose: "Fetch the national forecast text summary published by UK-AIR."
    endpoints:
      - method: GET
        path: /ajax/forecast_text_summary.php
        data: "HTML/text forecast narrative"
    auth: "None"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "424"

  - id: front-end__qualtrics
    source: aqie-front-end
    target: qualtrics
    target_kind: external
    protocol: HTTPS
    direction: outbound
    interaction: user-redirect
    purpose: "Link citizens to the feedback survey."
    data_exchanged: "No service data; user follows an outbound link"
    auth: "None"
    confidence: confirmed
    evidence:
      - repo: aqie-front-end
        file: src/config/index.js
        lines: "245"

  # --- Core data acquisition ------------------------------------------------
  - id: back-end__ricardo
    source: aqie-back-end
    target: ricardo-ukair
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: scheduled-batch
    purpose: "Ingest monitoring station metadata and pollutant measurements into MongoDB on a cron schedule."
    endpoints:
      - method: POST
        path: /api/login_check
        data: "Credentials exchanged for bearer token"
      - method: GET
        path: /api/pollutant_measurement_datas
        data: "Time-series pollutant concentrations per station"
      - method: GET
        path: /api/pollutant_metadatas
        data: "Pollutant definitions, units, thresholds"
      - method: GET
        path: /api/site_meta_datas
        data: "Monitoring site metadata"
    schedule_vars: ["AURN_SCHEDULE", "POLLUTANTS_SCHEDULE", "MONITORING_STATIONS_SCHEDULE"]
    auth: "Username/password login exchanged for bearer token"
    confidence: confirmed
    evidence:
      - repo: aqie-back-end
        file: src/config/index.js
        lines: "Ricardo URL block"
      - repo: aqie-back-end
        file: src/api/aurn/fetch-aurn-measurements.js

  - id: back-end__postcodes-io
    source: aqie-back-end
    target: postcodes-io
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Resolve station coordinates to the owning local authority."
    endpoints:
      - method: GET
        path: /postcodes
        data: "lat/lon and radius in; postcode and local authority out"
    auth: "None"
    confidence: confirmed
    evidence:
      - repo: aqie-back-end
        file: src/api/locationsite/helpers/get-local-authority.js

  - id: back-end__met-office
    source: aqie-back-end
    target: met-office-sftp
    target_kind: external
    protocol: SFTP
    direction: inbound-pull
    interaction: scheduled-batch
    purpose: "Collect Met Office air quality forecast files and expose them via the SFTP API routes."
    data_exchanged: "Forecast data files retrieved from a configured remote directory"
    schedule_vars: ["FORECAST_SCHEDULE"]
    auth: "SSH private key"
    confidence: confirmed
    evidence:
      - repo: aqie-back-end
        file: src/api/metOfficeForecast/index.js

  - id: back-end__govuk-notify
    source: aqie-back-end
    target: govuk-notify
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Send notifications from the back-end service."
    auth: "API key"
    confidence: provisional
    open_question: "Confirm whether notification sending is active here or fully delegated to aqie-notify-service."
    evidence:
      - repo: aqie-back-end
        file: src/config/index.js
        lines: "NOTIFY_BASE_URL"

  - id: forecast-api__met-office
    source: aqie-forecast-api
    target: met-office-sftp
    target_kind: external
    protocol: SFTP
    direction: inbound-pull
    interaction: scheduled-batch
    purpose: "Poll the Met Office directory for new forecast files, parse and persist them for the /forecast endpoint."
    data_exchanged: "XML forecast files parsed into forecast documents"
    schedule_vars: ["FORECAST_SCHEDULE", "FORECAST_RETRY_INTERVAL", "MET_OFFICE_DIRECTORY"]
    auth: "SSH private key"
    confidence: confirmed
    evidence:
      - repo: aqie-forecast-api
        file: src/forecast/batch-scheduler/runForecastSyncJob.js

  # --- Location and station resolution -------------------------------------
  - id: location-backend__os-names
    source: aqie-location-backend
    target: os-names
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Back the /osnameplaces endpoint with Ordnance Survey gazetteer search."
    endpoints:
      - method: GET
        path: /search/names/v1/find
        data: "Place-name query in; matched places with coordinates out"
    auth: "API key"
    confidence: confirmed
    evidence:
      - repo: aqie-location-backend
        file: src/config/index.js
        lines: "OS_NAMES_API_URL"

  - id: monitoringstation-backend__back-end
    source: aqie-monitoringstation-backend
    target: aqie-back-end
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Enrich monitoring station responses with station metadata."
    endpoints:
      - method: GET
        path: "/monitoringStationInfo?with-closed=true&with-pollutants=1&stream=data"
        data: "Full station metadata including closed sites and pollutant coverage"
    auth: "CDP internal network"
    confidence: confirmed
    notes: >-
      A /measurements variant exists only as a commented-out alternative default on the
      analysed commit. The endpoint is supplied by the overridable RICARDO_API_URL
      variable, so either could be in use at runtime — see oq-014.
    evidence:
      - repo: aqie-monitoringstation-backend
        file: src/config/index.js

  - id: monitoringstation-backend__location-backend
    source: aqie-monitoringstation-backend
    target: aqie-location-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Resolve a user location string to coordinates before finding nearby stations."
    endpoints:
      - method: POST
        path: /osnameplaces
        data: "Location query in; gazetteer matches out"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-monitoringstation-backend
        file: src/config/index.js

  # --- Historic data download journey --------------------------------------
  - id: dataselector-frontend__historicaldata-backend
    source: aqie-dataselector-frontend
    target: aqie-historicaldata-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: >-
      Drive the historic data selection and download journey: browse pollutant
      catalogues, request extracts, poll job status and obtain download links.
    endpoints:
      - method: POST
        path: /AtomDataSelection
        data: "Selection criteria (pollutants, years, sites) in; extract job reference out"
      - method: POST
        path: /AtomDataSelectionJobStatus
        data: "Job reference in; job state out"
      - method: GET
        path: /AtomDataSelectionPollutantMaster
        data: "Master list of selectable pollutants"
      - method: POST
        path: /AtomDataSelectionPollutantDataSource
        data: "Pollutant data sources available for selection"
      - method: POST
        path: /AtomDataSelectionPresignedUrlMail
        data: "Job reference in; pre-signed download URL issued by email"
      - method: POST
        path: /AtomEmailJobDataSelection
        data: "Email delivery request for a completed extract"
      - method: POST
        path: /AtomHistoryHourlydata
        data: "Hourly historic measurement series"
      - method: POST
        path: /AtomHistoryexceedence
        data: "Exceedence statistics for the selected criteria"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-dataselector-frontend
        file: src/config/config.js
        lines: "264-368"

  - id: dataselector-frontend__location-backend
    source: aqie-dataselector-frontend
    target: aqie-location-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Resolve place names entered in the data selection journey."
    endpoints:
      - method: POST
        path: /osnameplaces
        data: "Place-name query in; matches out"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-dataselector-frontend
        file: src/config/config.js
        lines: "252"

  - id: dataselector-frontend__monitoringstation-backend
    source: aqie-dataselector-frontend
    target: aqie-monitoringstation-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Find monitoring stations relevant to the selected location."
    endpoints:
      - method: POST
        path: /monitoringstation
        data: "Location in; nearby stations with pollutants out"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-dataselector-frontend
        file: src/config/config.js
        lines: "258"

  # --- Alerts and notifications --------------------------------------------
  - id: alert-backend__ricardo
    source: aqie-alert-back-end-service
    target: ricardo-ukair
    target_kind: external
    protocol: HTTPS/REST
    direction: outbound
    interaction: scheduled-batch
    purpose: "Poll Ricardo for DAQI and air quality summary report alerts that trigger citizen notifications."
    endpoints:
      - method: POST
        path: /api/login_check
        data: "Credentials exchanged for bearer token"
      - method: GET
        path: /api/daqi_alerts
        data: "DAQI threshold breach alerts by region"
      - method: GET
        path: /api/aqsr_alerts
        data: "Air quality summary report alerts"
      - method: GET
        path: /api/site_meta_datas
        data: "Site metadata for alert targeting"
    auth: "Username/password login exchanged for bearer token"
    confidence: confirmed
    evidence:
      - repo: aqie-alert-back-end-service
        file: src/config.js
        lines: "162,168,174,223"

  - id: alert-backend__front-end
    source: aqie-alert-back-end-service
    target: aqie-front-end
    target_kind: aqie-service
    protocol: HTTPS
    direction: outbound-link
    interaction: user-redirect
    purpose: >-
      Build unsubscribe and location deep links embedded in outgoing alert
      messages. This is link construction, not a runtime API call.
    endpoints:
      - method: GET
        path: /notify/unsubscribe-email-link
        data: "Email identifier carried as a query parameter"
    auth: "Tokenised link"
    confidence: confirmed
    evidence:
      - repo: aqie-alert-back-end-service
        file: src/config.js
        lines: "153,255"

  - id: notify-service__alert-backend
    source: aqie-notify-service
    target: aqie-alert-back-end-service
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Process inbound SMS STOP replies by opting the citizen out of SMS alerts."
    endpoints:
      - method: DELETE
        path: /opt-out-sms-alert
        data: "{ phoneNumber } in; opt-out confirmation out"
    auth: "CDP internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-notify-service
        file: src/subscribe/services/sms-reply.service.js
        lines: "103-111"

  - id: notify-service__govuk-notify
    source: aqie-notify-service
    target: govuk-notify
    target_kind: external
    protocol: HTTPS/REST
    direction: bidirectional
    interaction: synchronous
    purpose: "Send subscription, verification and alert messages, and retrieve inbound SMS replies."
    data_exchanged: "Templated email and SMS payloads out; received SMS messages in"
    auth: "API key"
    confidence: confirmed
    evidence:
      - repo: aqie-notify-service
        file: src/subscribe/services/sms-reply.service.js

  # --- Domestic combustion (Smoke Control) ---------------------------------
  - id: dc-frontend__dc-backend
    source: aqie-dc-frontend
    target: aqie-dc-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Retrieve exempt appliance and authorised fuel register records for the public search journey."
    endpoints:
      - method: GET
        path: /get-all/{type}
        data: "Register type in; full record set out"
      - method: GET
        path: /get/{type}/{id}
        data: "Single register record"
    auth: "CDP internal network; an x-api-key header is sent but not validated by the target"
    confidence: confirmed
    status: "BROKEN CONTRACT — see oq-006"
    notes: >-
      The frontend calls /get-all/{type} and /get/{type}/{id}, but neither path is
      served by aqie-dc-backend on main. The frontend has not changed since April
      while the backend API was reshaped. The public register journey is likely
      non-functional. This edge previously listed /api/appliances/search,
      /api/fuels/search and POST /applications; none of those are called by this
      frontend.
    evidence:
      - repo: aqie-dc-frontend
        file: src/server/common/api/api.js
        lines: "13-14,71-73"

  - id: defra-forms__dc-backend
    source: defra-forms
    target: aqie-dc-backend
    target_kind: aqie-service
    protocol: AWS SQS
    direction: inbound
    interaction: asynchronous
    purpose: >-
      Primary intake channel for smoke control applications. A background plugin
      long-polls the queue every five minutes, maps opaque DEFRA Forms field ids
      to domain fields, splits multi-appliance repeater submissions, and re-enters
      its own HTTP routes so queue ingest and API writes share one validation path.
    queue: "aqie-dc-queue"
    data_exchanged: >-
      meta.formSlug, meta.referenceNumber, meta.timestamp and data.main plus
      repeater blocks. Routed on formSlug
      'get-a-solid-fuel-certified-for-use-in-smoke-control-areas'.
    auth: "IAM task role"
    confidence: confirmed
    evidence:
      - repo: aqie-dc-backend
        file: src/sqs/client.js
        lines: "33-41,45-57,119-122"
      - repo: aqie-dc-backend
        file: src/plugins/sqs-consumer.js
        lines: "12-18"

  - id: dc-admin-frontend__dc-backend
    source: aqie-dc-admin-frontend
    target: aqie-dc-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Caseworker administration of appliances, fuels, applications and technical review."
    endpoints:
      - method: GET
        path: /applications/search
        data: "Filter criteria in; application case records out"
      - method: PATCH
        path: /appliances/{id}/technical-review
        data: "Technical review decision payload"
      - method: POST
        path: /admin/import/initiate
        data: "Bulk import request"
    auth: "CDP internal network; user authenticated at the frontend via Entra ID"
    confidence: confirmed
    evidence:
      - repo: aqie-dc-admin-frontend
        file: src/config/config.js
        lines: "BACKEND_URL"

  - id: dc-admin-frontend__azure-entra
    source: aqie-dc-admin-frontend
    target: azure-entra
    target_kind: external
    protocol: HTTPS/OIDC
    direction: outbound
    interaction: synchronous
    purpose: "Authenticate DEFRA staff into the administration interface."
    data_exchanged: "OIDC authorisation code flow; identity claims returned"
    auth: "OpenID Connect via MSAL"
    confidence: confirmed
    evidence:
      - repo: aqie-dc-admin-frontend
        file: src/config/azure-auth.js
        lines: "7"

  - id: dc-backend__cdp-uploader
    source: aqie-dc-backend
    target: cdp-uploader
    target_kind: platform
    protocol: HTTPS/REST
    direction: bidirectional
    interaction: asynchronous
    purpose: "Upload supporting evidence files for virus scanning; receive scan outcome via callback."
    endpoints:
      - method: POST
        path: /upload-and-scan/{uploadId}
        data: "Upload initiation; file stored in S3"
      - method: POST
        path: /upload-callback
        data: "Scan result callback received from the uploader"
    auth: "Platform-internal network"
    confidence: confirmed
    evidence:
      - repo: aqie-dc-backend
        file: src/config.js
        lines: "144"

  # --- Pollutant Release and Transfer Register -----------------------------
  - id: prtr-frontend__prtr-backend
    source: aqie-prtr-frontend
    target: aqie-prtr-backend
    target_kind: aqie-service
    protocol: HTTPS/REST
    direction: outbound
    interaction: synchronous
    purpose: "Search and display industrial facility pollutant release records."
    endpoints:
      - method: GET
        path: /facilities/search
        data: "Search criteria in; matching facilities out"

    reason: "Both target endpoints removed."
    residual_risk: >-
      The performance test entrypoint hardcodes a plan that exercises both endpoints, so
      the suite will now report failures against them until updated.

  - id: dc-backend__s3
    claim: "aqie-dc-backend -> AWS S3 (read scanned uploads after the CDP Uploader callback)"
    decommissioned_by: "aqie-dc-backend PR #123 (commit a644220)"
    decommissioned_at_utc: "2026-10-27T17:45:34Z"
    reason: >-
      The uploader callback handler (src/routes/upload-callback.js) and the S3 download
      helper (src/common/helpers/s3-download.js) were deleted. No S3 client is imported
      anywhere in src; the only AWS SDK import is @aws-sdk/client-sqs. The bucket named in
      configuration is the CDP Uploader's destination: the uploader writes to it and this
